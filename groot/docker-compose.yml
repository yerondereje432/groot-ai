# =============================================================
# GROOT — Local development infrastructure
# Postgres (with pgvector) + Redis + Adminer for DB inspection
# =============================================================
#
# Per spec §15: MVP uses pgvector extension on PostgreSQL
# Per spec §28:  Redis for sessions, rate limits, hot RAG retrievals
# Per spec §41:  All schema-relevant tables are in apps/api/prisma/schema.prisma
# =============================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: groot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-groot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-groot_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-groot}
    ports:
      - "5432:5432"
    volumes:
      - groot-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-groot} -d ${POSTGRES_DB:-groot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: groot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - groot-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: groot-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  groot-postgres-data:
  groot-redis-data:
